name: VPS Run Command

# Bridge that lets Claude Code (mobile/web, which reaches the VPS through GitHub)
# run arbitrary shell commands on the box. Dispatch from the Actions tab or:
#   gh workflow run vps-run.yml -f command="systemctl status caddy --no-pager"
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to run on the VPS as root'
        required: true
        default: 'uptime'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The command is passed through env, never interpolated into the shell
      # block directly, so multi-line/quoting-heavy commands survive intact.
      - name: Run command on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CMD: ${{ github.event.inputs.command }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" "$CMD"
