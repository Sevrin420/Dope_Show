<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050508">
<title>Dope Show</title>
<style>
  /* Handheld shell, in the game's palette: indigo plastic, gold trim, neon-red buttons. */
  :root { --plastic:#26243f; --plastic-hi:#34315a; --plastic-lo:#17162a; --bezel:#0c0b16; --gold:#f7d24a; --red:#ea3d4f; --red-lo:#8f1526; --ink:#8d8ab4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#050508; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
         font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  #gb { container-type:inline-size; position:relative; width:min(100vw, calc(100dvh / 1.66), 560px); height:min(100dvh, calc(min(100vw, 560px) * 2.2)); min-height:calc(min(100vw, calc(100dvh / 1.66), 560px) * 1.66);
        background:linear-gradient(160deg, var(--plastic-hi) 0%, var(--plastic) 45%, var(--plastic-lo) 100%);
        border-radius:3cqw 3cqw 15cqw 3cqw; box-shadow:inset 0 0.6cqw 0 rgba(255,255,255,.08), inset -0.8cqw -1cqw 0 rgba(0,0,0,.35), 0 2cqw 6cqw rgba(0,0,0,.6);
        padding:0 4cqw; display:flex; flex-direction:column; }
  /* top ridge with the power switch */
  .ridge { height:7cqw; position:relative; border-bottom:0.4cqw solid rgba(0,0,0,.35); margin:0 -4cqw; box-shadow:0 0.4cqw 0 rgba(255,255,255,.05); }
  .ridge::before, .ridge::after { content:""; position:absolute; top:0; bottom:0; width:0.4cqw; background:rgba(0,0,0,.35); }
  .ridge::before { left:4cqw; } .ridge::after { right:4cqw; }
  #power { position:absolute; left:9cqw; top:1.2cqw; display:flex; align-items:center; gap:1.6cqw; cursor:pointer; }
  .slot { width:13cqw; height:3cqw; border-radius:2cqw; background:var(--plastic-lo); box-shadow:inset 0 0.5cqw 0.8cqw rgba(0,0,0,.7); position:relative; }
  .knob { position:absolute; top:-0.4cqw; left:0; width:6cqw; height:3.8cqw; border-radius:1cqw; background:linear-gradient(#55527c,#2c2a48);
          box-shadow:0 0.4cqw 0 #121122; transition:left .18s; }
  .knob::after { content:""; position:absolute; inset:0.9cqw 1.6cqw; background:repeating-linear-gradient(90deg,#1a1930 0 0.4cqw,transparent 0.4cqw 0.9cqw); }
  .on .knob { left:7cqw; }
  .plabel { font-size:2.4cqw; letter-spacing:0.3cqw; color:var(--ink); font-weight:bold; }
  .plabel b { color:var(--gold); } .on .plabel b { text-shadow:0 0 1.5cqw var(--gold); }
  #hint { position:absolute; left:46cqw; top:1.5cqw; font-size:2.4cqw; color:var(--gold); font-weight:bold; letter-spacing:.3cqw; animation:blink 1s steps(2) infinite; }
  .on #hint { display:none; }
  @keyframes blink { 50% { opacity:0; } }
  /* screen */
  .bezel { margin-top:3.5cqw; background:var(--bezel); border-radius:2cqw 2cqw 9cqw 2cqw; padding:1.2cqw 2.4cqw 5cqw; box-shadow:inset 0 0 0 0.3cqw #1f1d36; }
  .btop { display:flex; align-items:center; gap:1.5cqw; height:5cqw; font-size:2.2cqw; color:var(--ink); letter-spacing:.25cqw; white-space:nowrap; }
  .btop .line { flex:1; height:0.5cqw; background:linear-gradient(var(--red) 0 33%, transparent 33% 66%, var(--gold) 66%); opacity:.8; }
  #led { width:2cqw; height:2cqw; border-radius:50%; background:#3a0c12; box-shadow:inset 0 0.3cqw 0.4cqw rgba(0,0,0,.6); flex:none; }
  .on #led { background:#ff3346; box-shadow:0 0 1.6cqw #ff3346, 0 0 0.6cqw #ff99a2; }
  .screen { position:relative; width:100%; aspect-ratio:1; background:#06060c; border-radius:0.6cqw; overflow:hidden; box-shadow:inset 0 0 2cqw rgba(0,0,0,.9); }
  canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:crisp-edges; image-rendering:pixelated; display:block; opacity:0; transition:opacity .25s; }
  .on canvas { opacity:1; }
  .screen::before { content:"PRESS A OR SLIDE POWER"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#4b4870;
                    font:bold 3.6cqw/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.4cqw; animation:blink 1.2s steps(2) infinite; pointer-events:none; }
  .on .screen::before { display:none; }
  .screen::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(130deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 35%); }
  /* logo */
  .logo { margin:2.6cqw 0 0 1cqw; font-family:"Arial Black","Trebuchet MS",sans-serif; font-weight:900; font-style:italic; font-size:6.4cqw; letter-spacing:-0.1cqw;
          color:var(--gold); text-shadow:0.5cqw 0.5cqw 0 var(--red-lo); line-height:1; }
  .logo span { font-size:3cqw; color:var(--red); text-shadow:none; letter-spacing:.4cqw; margin-left:1.5cqw; vertical-align:middle; font-style:normal; }
  /* controls */
  .controls { position:relative; flex:1; min-height:52cqw; }
  .pad-area { position:absolute; left:0; right:0; top:50%; height:46cqw; transform:translateY(-58%); }
  #dpad { position:absolute; left:3cqw; top:6cqw; width:33cqw; height:33cqw; touch-action:none; }
  #dpad .h, #dpad .v { position:absolute; background:linear-gradient(145deg,#2b2a3c,#0f0f19); border-radius:1.2cqw; box-shadow:0 0.8cqw 0 #06060c, inset 0 0.3cqw 0 rgba(255,255,255,.08); }
  #dpad .h { left:0; right:0; top:34%; height:32%; } #dpad .v { top:0; bottom:0; left:34%; width:32%; }
  #dpad .hub { position:absolute; left:43%; top:43%; width:14%; height:14%; border-radius:50%; background:radial-gradient(#0b0b14,#1d1c2c); }
  #dpad i { position:absolute; width:0; height:0; border:1.6cqw solid transparent; opacity:.35; }
  #dpad .au { left:50%; top:6%; transform:translateX(-50%); border-bottom-color:#9a98c4; border-top:0; }
  #dpad .ad { left:50%; bottom:6%; transform:translateX(-50%); border-top-color:#9a98c4; border-bottom:0; }
  #dpad .al { top:50%; left:6%; transform:translateY(-50%); border-right-color:#9a98c4; border-left:0; }
  #dpad .ar { top:50%; right:6%; transform:translateY(-50%); border-left-color:#9a98c4; border-right:0; }
  #dpad.up .v { transform:translateY(-0.4cqw) rotateX(12deg); } #dpad.down .v { transform:rotateX(-12deg); }
  #dpad.left .h { transform:rotateY(-12deg); } #dpad.right .h { transform:rotateY(12deg); }
  #dpad.up .au, #dpad.down .ad, #dpad.left .al, #dpad.right .ar { opacity:1; }
  .ab { position:absolute; right:2cqw; top:8cqw; width:42cqw; height:26cqw; transform:rotate(-25deg); border-radius:14cqw; background:rgba(0,0,0,.18); box-shadow:inset 0 0.4cqw 0.8cqw rgba(0,0,0,.35); }
  .btn { position:absolute; top:4cqw; width:17cqw; height:17cqw; border-radius:50%; border:0; padding:0; touch-action:none; cursor:pointer;
         background:radial-gradient(circle at 35% 30%, #ff7b88 0%, var(--red) 40%, var(--red-lo) 100%); box-shadow:0 1cqw 0 #4a0912, 0 1.4cqw 1.4cqw rgba(0,0,0,.45); }
  .btn.pressed { transform:translateY(0.8cqw); box-shadow:0 0.2cqw 0 #4a0912; filter:brightness(1.15); }
  #bB { left:3cqw; } #bA { right:3cqw; }
  .btn + .lbl, .lbl { position:absolute; top:22.5cqw; font-size:3.6cqw; font-weight:900; color:var(--ink); letter-spacing:.3cqw; }
  .lbl.b { left:10cqw; } .lbl.a { right:10cqw; }
  .grille { position:absolute; right:5cqw; bottom:3.5cqw; display:flex; gap:2.2cqw; transform:rotate(-28deg); }
  .grille i { width:1.6cqw; height:10cqw; border-radius:1cqw; background:var(--plastic-lo); box-shadow:inset 0 0.5cqw 0.6cqw rgba(0,0,0,.8); }
  .badge { position:absolute; left:6cqw; bottom:4.5cqw; font-size:2.2cqw; color:var(--ink); letter-spacing:.3cqw; opacity:.8; }
  .badge b { color:var(--red); }
</style>
</head>
<body>
<div id="gb">
  <div class="ridge">
    <div id="power" role="switch" aria-label="Power"><span class="plabel">OFF&#9664;</span><div class="slot"><div class="knob"></div></div><span class="plabel">&#9654;<b>ON</b></span></div>
    <div id="hint">&#9664; POWER</div>
  </div>
  <div class="bezel">
    <div class="btop"><i id="led"></i><span>DOT MATRIX &middot; DIRECTORATE ISSUE</span><span class="line"></span></div>
    <div class="screen"><canvas id="c" width="256" height="256"></canvas></div>
  </div>
  <div class="logo">DOPE&nbsp;SHOW<span>HUSTLE&nbsp;SYSTEM</span></div>
  <div class="controls">
    <div class="pad-area">
    <div id="dpad"><div class="h"></div><div class="v"></div><div class="hub"></div><i class="au"></i><i class="ad"></i><i class="al"></i><i class="ar"></i></div>
    <div class="ab"><button class="btn" id="bB" aria-label="B"></button><button class="btn" id="bA" aria-label="A"></button><span class="lbl b">B</span><span class="lbl a">A</span></div>
    </div>
    <div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="badge">PROPERTY OF THE <b>DIRECTORATE</b></div>
  </div>
</div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   DOPE SHOW — a dystopian wheel-map hustle, drawn in a 16-bit
   top-down (A Link to the Past) style.

   Art rules, enforced in code:
   • 256x256 internal buffer, nearest-neighbour upscaled, integer scale.
   • 15-bit colour: every colour is built from 5 bits per channel (C()).
   • Light from the top-left: highlight on top/left edges, shade on
     bottom/right edges (Painter.render).
   • 3-tone ramps per material, hue-shifted (cool shadows, warm lights).
   • Auto 1px dark outline on every sprite (Painter.render).
   • Dark oval drop shadows, Y-sorted drawing, 3 facings (side is mirrored),
     palette-swapped enemies, bitmap font, bordered windows.
   • Semi-3D: every street object has a height map; you can jump onto it and
     stand above the patrols. Depth sort uses ground y plus height.
   ════════════════════════════════════════════════════════════════════ */

// ───────────────────────── Game constants ─────────────────────────
const SZ = 256, MAP = 576, MC = MAP / 2;              // screen buffer, world size (5x the area of one screen), world centre
const TOTAL_DAYS = 30, DAY_LEN = 26;
const START_CASH = 2000, START_DEBT = 5500, INTEREST = .06, CAPACITY = 30, CLINIC = 500;
const SPREAD = .82, IMPACT = .012;                     // dealers buy back at 82% of their asking price; every unit traded moves that market 1.2%
const WALK = 58, DASH_SPEED = 150, DASH_TIME = .25, DASH_CD = 1.6;
const GRAV = 520, JUMP_V = 150, STEP = 3, SAFE_Z = 6;  // jump apex ~21px; 6px off the ground nobody can touch you
const ROAD_HW = 20, SIDEWALK = 5, PLAZA_R = 30, HUB_R = 40, R_IN = 100, R_OUT = 205, WALL_R = 266, FACE = 12;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').imageSmoothingEnabled = false; return c; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ───────────────────────── 15-bit palette ─────────────────────────
const C = (r, g, b) => `rgb(${r<<3|r>>2},${g<<3|g>>2},${b<<3|b>>2})`;   // 5 bits per channel, like the SNES
const K = {
  out:C(3,2,6), white:C(30,30,31), shadow:C(2,2,6), dim:C(14,14,19), gray:C(12,12,16),
  conc:[C(8,8,13),C(13,13,18),C(19,19,24)],
  roof:[C(10,10,16),C(16,16,22),C(23,23,28)],
  wall:[C(8,6,11),C(13,10,15),C(19,15,19)],
  rust:[C(9,4,3),C(16,8,4),C(23,13,6)],
  wood:[C(5,3,5),C(10,7,8),C(16,12,12)],
  skin:[C(14,8,7),C(21,13,11),C(27,19,16)],
  yellow:[C(14,9,3),C(22,16,4),C(30,24,9)],
  red:[C(12,2,5),C(21,5,8),C(29,11,13)],
  scarf:[C(14,2,5),C(24,5,8),C(30,11,13)],
  teal:[C(3,8,13),C(6,14,20),C(12,21,26)],
  bone:[C(17,16,16),C(24,23,22),C(30,30,28)],
  green:[C(3,9,7),C(6,16,10),C(12,23,15)],
  dark:[C(3,3,7),C(5,5,10),C(9,9,14)],
  pants:[C(4,4,9),C(7,7,13),C(11,11,17)],
  boots:[C(3,2,5),C(6,4,8),C(10,8,11)],
  bag:[C(6,5,3),C(11,9,5),C(17,14,8)],
  visor:C(2,2,6), glint:C(31,8,8), eye:C(3,2,6),
  gBase:C(9,8,10), gDark:C(6,5,8), gLight:C(12,11,13),
  rMid:C(12,12,16), rDark:C(9,9,13), rLight:C(17,17,22), dash:C(20,17,6), curbL:C(22,22,26), curbD:C(5,5,9),
  vBase:C(4,3,6), vSpeck:C(6,5,9),
  wallL:C(19,18,22), wallM:C(13,12,17), wallD:C(8,7,11), seam:C(4,4,7),
  pA:C(14,13,17), pB:C(11,10,15), pSeam:C(7,6,10),
  winLit:C(30,26,10), winCyan:C(10,26,30), winOff:C(2,2,7), signBg:C(2,2,6),
  winLight:C(26,26,30), winMid:C(10,10,18), winFill:C(3,3,9), btn:C(7,7,17), btnOff:C(6,6,10),
};

Object.assign(K, {
  asph:[C(6,6,9),C(8,8,12),C(11,11,15)], side:[C(12,11,14),C(15,14,17),C(19,18,21)],
  lane:C(21,17,5), zebra:C(19,19,21), puddle:C(3,5,11), void:C(2,2,4),
  crate:[C(11,6,3),C(17,11,5),C(23,16,8)], crateTop:[C(15,9,4),C(22,15,7),C(27,21,11)], crateLine:C(8,5,3),
  metal:[C(8,9,12),C(13,14,17),C(20,21,24)], tire:C(3,3,4), glass:C(4,6,13), glassHi:C(12,16,25),
  dump:[C(3,8,5),C(5,12,8),C(9,17,11)], hazard:C(27,22,3), lamp:C(31,28,16),
  BLD:[
    [C(7,7,10),C(10,10,14),C(14,14,18), C(8,6,10),C(12,9,13),C(16,13,17)],
    [C(5,5,6),C(7,7,9),C(10,10,12),     C(10,6,6),C(14,9,8),C(18,12,10)],
    [C(9,6,5),C(12,8,6),C(15,11,8),     C(7,8,10),C(10,11,14),C(14,15,18)],
    [C(4,7,8),C(6,10,11),C(9,14,15),    C(7,7,11),C(10,10,15),C(14,14,19)],
  ],
});

// ───────────────────────── Data ─────────────────────────
const DRUGS = [
  { name:'MOSS',  key:'M', min:300,   max:900,   color:C(14,28,12) },
  { name:'VOLT',  key:'V', min:70,    max:250,   color:C(30,28,8)  },
  { name:'HUSH',  key:'H', min:10,    max:60,    color:C(22,16,31) },
  { name:'PRISM', key:'P', min:1000,  max:4500,  color:C(31,14,24) },
  { name:'NULL',  key:'N', min:5000,  max:14000, color:C(31,20,8)  },
  { name:'AURA',  key:'A', min:15000, max:30000, color:C(14,28,31) },
];
const mid = d => (d.min + d.max) / 2;
const WARDS = [
  ['DOCKS','THE DOCKS',C(31,8,18)], ['RUST','RUST MARKET',C(31,18,4)], ['GRID9','GRID 9',C(8,28,31)],
  ['HIVE','THE HIVE',C(10,30,12)],  ['ASH','ASH YARD',C(22,12,31)],
];
const SLOGANS = ['THE DIRECTORATE SEES ALL.','COMPLIANCE IS FREEDOM.','REPORT YOUR NEIGHBORS.','YOUR DEBT IS YOUR DUTY.','CURFEW IS AT DAWN.','TRUST THE DIRECTORATE.'];

// ───────────────────────── World graph ─────────────────────────
// Spire in the middle, an inner ring of junctions, five ward towers on the outer ring.
const nodes = [{ x:MC, y:MC, name:'SPIRE', title:'THE SPIRE', hub:true, tower:true, neon:C(31,6,6) }];
for (let i = 0; i < 5; i++) {
  const a = -Math.PI/2 + i * 2*Math.PI/5;
  nodes.push({ x:Math.round(MC + Math.cos(a)*R_OUT), y:Math.round(MC + Math.sin(a)*R_OUT), name:WARDS[i][0], title:WARDS[i][1], tower:true, neon:WARDS[i][2] });
}
for (let i = 0; i < 5; i++) {
  const a = -Math.PI/2 + i * 2*Math.PI/5;
  nodes.push({ x:Math.round(MC + Math.cos(a)*R_IN), y:Math.round(MC + Math.sin(a)*R_IN), junction:true });
}
const TOWERS = [0, 1, 2, 3, 4, 5];
const edges = [];
function addEdge(a, b) { const dx = nodes[b].x - nodes[a].x, dy = nodes[b].y - nodes[a].y, len = Math.hypot(dx, dy); edges.push({ a, b, len, dx:dx/len, dy:dy/len }); }
for (let i = 0; i < 5; i++) { addEdge(0, 6 + i); addEdge(6 + i, 1 + i); addEdge(6 + i, 6 + (i + 1) % 5); addEdge(1 + i, 1 + (i + 1) % 5); }
const adj = nodes.map((_, n) => edges.map((e, i) => i).filter(i => edges[i].a === n || edges[i].b === n));
const edgePos = (e, t) => ({ x: nodes[edges[e].a].x + edges[e].dx*edges[e].len*t, y: nodes[edges[e].a].y + edges[e].dy*edges[e].len*t });

// ───────────────────────── Utilities ─────────────────────────
const rnd = (a, b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1 | seed); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const hash = (x, y) => { let h = (x*374761393 + y*668265263) | 0; h = Math.imul(h ^ h>>>13, 1274126177); return ((h ^ h>>>16) >>> 0) / 4294967296; };

// ───────────────────────── Painter: the SNES sprite rules ─────────────────────────
// Cells hold material ids. render() applies top-left lighting and the 1px outline.
class Painter {
  constructor(w, h) { this.w = w; this.h = h; this.g = new Uint8Array(w*h); this.m = [null]; }
  mat(c) { this.m.push({ c, shaded:Array.isArray(c) }); return this.m.length - 1; }
  at(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? 0 : this.g[y*this.w + x]; }
  px(x, y, m) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y*this.w + x] = m; }
  rect(x, y, w, h, m) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x+i, y+j, m); }
  ell(cx, cy, rx, ry, m) { for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) if (i*i/(rx*rx+.5) + j*j/(ry*ry+.5) <= 1) this.px(cx+i, cy+j, m); }
  line(x0, y0, x1, y1, m) {
    const dx = Math.abs(x1-x0), dy = -Math.abs(y1-y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (;;) { this.px(x0, y0, m); if (x0 === x1 && y0 === y1) break; const e2 = 2*e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  render(outline = K.out) {
    const c = mk(this.w + 2, this.h + 2), x = c.getContext('2d');
    for (let j = -1; j <= this.h; j++) for (let i = -1; i <= this.w; i++) {
      const m = this.at(i, j);
      if (m) {
        const d = this.m[m]; let col = d.c;
        if (d.shaded) {
          const dark = !this.at(i, j+1) || !this.at(i+1, j), light = !this.at(i, j-1) || !this.at(i-1, j);
          col = dark ? d.c[0] : light ? d.c[2] : d.c[1];
        }
        x.fillStyle = col; x.fillRect(i+1, j+1, 1, 1);
      } else if (outline && (this.at(i-1, j) || this.at(i+1, j) || this.at(i, j-1) || this.at(i, j+1))) {
        x.fillStyle = outline; x.fillRect(i+1, j+1, 1, 1);
      }
    }
    return c;
  }
}


// ───────────────────────── Bitmap font (5x7) ─────────────────────────

// ───────────────────────── Character sprites (16x22, 4 frames: idle, step, step, jump) ─────────────────────────
function buildChar(dir, f, o) {
  const p = new Painter(16, 22);
  const H = p.mat(o.hood), Cc = p.mat(o.coat), T = p.mat(o.trim), Sk = p.mat(K.skin), Pn = p.mat(K.pants), Bt = p.mat(K.boots),

  if (!side) {

    p.rect(5, 15, 2, l, Pn); p.rect(9, 15, 2, r, Pn); p.rect(7, 15, 2, 1, Pn);
    p.rect(4, 15 + l, 3, 2, Bt); p.rect(9, 15 + r, 3, 2, Bt);

  else if (f === 1 || jump) { p.rect(4, 15, 3, 4, Pn); p.rect(3, 19, 4, 2, Bt); p.rect(9, 15, 3, 4, Pn); p.rect(9, 19, 5, 2, Bt); }
  else { p.rect(6, 15, 3, 5, Pn); p.rect(5, 20, 5, 2, Bt); p.rect(8, 15, 3, 4, Pn); p.rect(9, 19, 4, 2, Bt); }

  if (!side) {
    p.rect(4, 8, 8, 7, Cc); p.rect(4, 15, 3, 2, Cc); p.rect(9, 15, 3, 2, Cc);            // coat and its tails
    const la = f === 1 ? 1 : 0, ra = f === 2 ? 1 : 0;
    p.rect(2, armY + la, 2, 5, Cc); p.rect(12, armY + ra, 2, 5, Cc);
    p.rect(2, armY + 5 + la, 2, 1, Gv); p.rect(12, armY + 5 + ra, 2, 1, Gv);             // gloves
    p.rect(4, 13, 8, 1, T);
    if (!back) { p.px(7, 13, Gd); p.px(8, 13, Gd); p.px(7, 10, T); p.px(8, 11, T); }    // buckle, zip
    if (o.helm) { p.rect(1, 8, 4, 3, H); p.rect(11, 8, 4, 3, H); p.px(2, 9, Gd); p.px(13, 9, Gd); }
    if (o.mask) { p.px(3, 7, Fc); p.px(12, 7, Fc); p.px(4, 11, Gd); p.px(5, 12, Gd); }  // spikes, chain
    if (back && !o.helm) { p.rect(5, 9, 6, 5, Pk); p.rect(5, 9, 6, 1, T); p.px(7, 11, Gd); p.px(8, 11, Gd); }

    p.rect(5, 8, 6, 7, Cc); p.rect(5, 15, 6, 2, Cc); p.rect(5, 13, 6, 1, T);
    if (!o.helm) { p.rect(2, 9, 3, 6, Pk); p.px(3, 9, T); } else p.rect(4, 8, 3, 3, H);
    const ax = 7 + (f === 1 ? 1 : f === 2 ? -1 : 0);

  }
  // head
  if (o.helm) {
    if (side) { p.rect(5, 0, 6, 1, H); p.rect(4, 1, 8, 7, H); p.rect(8, 4, 4, 2, V); p.px(10, 5, Gl); p.rect(5, 7, 4, 1, T); }
    else { p.rect(5, 0, 6, 1, H); p.rect(3, 1, 10, 7, H); p.px(7, 1, Gd); p.px(8, 1, Gd);
      if (!back) { p.rect(4, 4, 8, 2, V); p.px(5, 5, Gl); p.px(10, 5, Gl); p.rect(5, 7, 6, 1, T); } }
  } else if (side) {
    p.rect(5, 0, 6, 1, H); p.rect(4, 1, 8, 3, H); p.rect(4, 4, 3, 4, H); p.rect(7, 4, 5, 4, Fc); p.px(12, 6, Fc);
    if (o.mask) { p.rect(10, 5, 1, 2, V); p.px(11, 7, V); }
    else if (o.goggles) { p.rect(7, 5, 5, 1, T); p.px(10, 5, Lens); p.px(11, 7, Mo); }
    else { p.px(10, 6, V); p.px(11, 7, Mo); }
    p.rect(5, 8, 6, 1, T); if (o.scarfTail) p.rect(2 + (f & 1), 9, 3, 1, T);
  } else if (back) {
    p.rect(5, 0, 6, 1, H); p.rect(4, 1, 8, 2, H); p.rect(3, 3, 10, 5, H); p.px(7, 2, T); p.px(8, 3, T);
    p.rect(5, 8, 6, 1, T); if (o.scarfTail) p.rect(9, 9, 1, 3 + (f & 1), T);
  } else {
    p.rect(5, 0, 6, 1, H); p.rect(4, 1, 8, 2, H); p.rect(3, 3, 2, 5, H); p.rect(11, 3, 2, 5, H); p.rect(5, 3, 6, 1, H);
    p.rect(5, 4, 6, 4, Fc);
    if (o.mask) { p.rect(6, 5, 1, 2, V); p.rect(9, 5, 1, 2, V); p.px(6, 7, V); p.px(8, 7, V); }
    else if (o.goggles) { p.rect(5, 5, 6, 1, T); p.px(6, 5, Lens); p.px(9, 5, Lens); p.px(7, 7, Mo); p.px(8, 7, Mo); }
    else { p.px(6, 6, V); p.px(9, 6, V); p.px(7, 7, Mo); }
    p.rect(5, 8, 6, 1, T); if (o.scarfTail) p.rect(10, 9, 1, 2 + (f & 1), T);
  }
  return p.render();
}

// ───────────────────────── Street objects you can jump on ─────────────────────────
// Each is a 3/4 box: top face (w x d) above a front face (w x h). Footprint w x d, height h.
const OBJ_SPEC = { crate:[12,9,12], crate2:[12,9,24], barrier:[14,5,8], dumpster:[16,9,13], car:[22,11,11], container:[22,11,22], drum:[7,6,10] };
function buildObj(type, R) {
  const [w, d, h] = OBJ_SPEC[type], p = new Painter(w, d + h), F = h + d;

    const TP = p.mat(K.crateTop), FR = p.mat(K.crate), DK = dark(K.crateLine), HI = dark(C(29,24,14));
    line(0, 0, w, d, TP); line(0, 3, w, 1, DK); line(0, 6, w, 1, DK); line(0, d - 1, w, 1, HI);

      const y0 = d + b*bh; line(0, y0, w, bh, FR);

      p.line(1, y0 + 1, w - 2, y0 + bh - 2, DK); p.line(w - 2, y0 + 1, 1, y0 + bh - 2, DK);

    line(0, 0, w, d, TP); line(0, d - 1, w, 1, HI); line(0, d, w, h, FR);
    for (let x = 0; x < w; x++) for (let y = d + 2; y < d + 5; y++) p.px(x, y, ((x + y) % 6) < 3 ? YL : BK);
  } else if (type === 'dumpster') {
    const TP = p.mat(K.dump), FR = p.mat(K.dump), DK = dark(C(2,5,3)), RS = dark(C(17,8,4)), WH = dark(K.tire), HI = dark(C(13,22,15));
    line(0, 0, w, d, TP); line(0, 4, w, 1, DK); line(0, d - 1, w, 1, HI); line(0, d, w, h, FR);
    line(2, d + 3, w - 4, 1, DK); line(4, d + 5, 8, 3, dark(C(6,8,7))); p.px(5, d + 6, dark(C(20,20,20))); p.px(8, d + 6, dark(C(20,20,20)));
    for (let i = 0; i < 6; i++) p.px(1 + (R()*(w - 2)|0), d + 1 + (R()*(h - 3)|0), RS);

          LT = dark(C(31,28,14)), BR = dark(C(6,4,4)), BU = p.mat(K.conc), RS = dark(C(15,7,3));
    line(0, 0, w, d, BD); line(4, 1, 5, d - 2, GL); line(15, 1, 4, d - 2, GL); p.px(5, 2, GH); p.px(16, 2, GH);
    line(0, d, w, h, BD); line(1, d + 1, w - 2, 3, GL); p.px(3, d + 1, GH); p.px(4, d + 2, GH);
    line(1, d + 5, 3, 2, LT); line(w - 4, d + 5, 3, 2, BR); line(8, d + 5, 6, 2, dark(K.out)); line(0, F - 4, w, 2, BU);
    line(1, F - 2, 4, 2, TI); line(w - 5, F - 2, 4, 2, TI);
    for (let i = 0; i < 5; i++) p.px(R()*w|0, R()*d|0, RS);
  } else if (type === 'container') {
    const col = pick([K.teal, K.rust, K.red]), TP = p.mat(col), FR = p.mat(col), RB = dark(K.out), HI = dark(C(26,26,28));
    line(0, 0, w, d, TP); for (let x = 1; x < w; x += 3) line(x, 0, 1, d, RB); line(0, d - 1, w, 1, HI);
    line(0, d, w, h, FR); for (let x = 1; x < w; x += 2) line(x, d + 1, 1, h - 2, RB);
    line(9, d + 2, 1, h - 4, dark(C(20,20,22))); line(12, d + 2, 1, h - 4, dark(C(20,20,22)));
    line(2, d + 3, 5, 3, dark(C(29,29,30))); p.px(3, d + 4, RB); p.px(5, d + 4, RB);

// ───────────────────────── Towers ─────────────────────────
function buildTower(seed, neon) {
  const R = rng(seed), p = new Painter(34, 46);
  const RF = p.mat(K.roof), WL = p.mat(K.wall), TR = p.mat(K.conc), SG = p.mat(K.signBg), DR = p.mat(K.winOff), FD = p.mat(K.dark), RS = p.mat(K.rust);
  const LIT = p.mat(K.winLit), CY = p.mat(K.winCyan), GL = p.mat(C(10,4,6)), SL = p.mat(C(22,20,24)), MT = p.mat(C(16,17,20)), RED = p.mat(K.glint), NE = p.mat(neon);
  p.ell(8, 4, 4, 3, RS); p.rect(5, 6, 1, 3, MT); p.rect(10, 6, 1, 3, MT);                   // water tank on stilts
  p.rect(27, 0, 1, 9, MT); p.px(27, 0, RED); p.rect(25, 3, 5, 1, MT);                         // antenna
  p.rect(16, 4, 7, 5, TR);                                                                   // AC unit
  p.rect(0, 8, 34, 7, RF); p.rect(2, 10, 30, 3, FD);                                         // roof slab and parapet
  p.rect(0, 15, 34, 31, WL); p.rect(0, 43, 34, 3, FD);                                       // facade, foundation
  p.rect(1, 16, 32, 9, SG);                                                                  // neon sign band (lettering drawn live)
  for (const x of [3, 9, 15, 21, 27]) { p.rect(x, 27, 4, 4, R() < .55 ? (R() < .7 ? LIT : CY) : DR); p.rect(x, 31, 4, 1, SL); }
  for (const x of [3, 9, 21, 27]) { p.rect(x, 34, 4, 4, R() < .45 ? LIT : DR); p.rect(x, 38, 4, 1, SL); }
  p.rect(11, 34, 12, 2, NE); p.rect(13, 36, 8, 10, DR); p.rect(15, 38, 4, 8, GL);           // awning, door
  p.rect(32, 15, 1, 28, RS); for (let y = 26; y < 44; y += 2) p.px(1, y, MT);               // drain pipe, fire ladder
  for (let i = 0; i < 6; i++) p.px(2 + (R()*30|0), 40 + (R()*3|0), p.mat(pick([C(31,8,18), C(8,28,31), C(30,26,8)])));   // graffiti
  return p.render();
}

  if (flip) { ctx.save(); ctx.translate(fx + 9, fy - 23); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); } else ctx.drawImage(img, fx - 9, fy - 23);
  ctx.globalAlpha = 1;
}
function drawTower(t, cx, cy) {
  const n = nodes[t], s = TOWER_SPR[t], x = n.x - (s.width >> 1) - cx, y = n.y - 3 - (s.height - 1) - cy;
  ctx.drawImage(s, x, y);
  const flick = Math.sin(T*3 + t*2) > -.93, col = flick ? n.neon : K.dim, bandX = n.hub ? x + 10 : x + 2, bandY = n.hub ? y + 35 : y + 17;
  text(n.name, bandX + 1 + (32 - (n.name.length*6 - 1)) / 2 | 0, bandY + 1, col, { shadow:K.shadow });
  if (n.hub) {                                                     // the all-seeing eye follows you
    const ex = x + 26 + Math.round(clamp((G.p.x - n.x) / 30, -3, 3)), ey = y + 12 + Math.round(clamp((G.p.y - n.y) / 60, -1, 1));
    ctx.fillStyle = K.glint; ctx.fillRect(ex - 1, ey - 1, 3, 3); ctx.fillStyle = K.out; ctx.fillRect(ex, ey, 1, 1);
  }
}
function drawBubble(b, fx, fy) {
  if (b.life < 5 && Math.floor(T*4) % 2) return;
  const s = DRUGS[b.drug].key + ' ' + money(b.price), w = s.length*6 + 5, x = fx - (w >> 1), y = fy - 23 - 13;
  rr(x, y, w, 12, K.out); rr(x+1, y+1, w-2, 10, K.winLight); rr(x+2, y+2, w-4, 8, K.winFill);
  ctx.fillStyle = K.winLight; ctx.fillRect(fx - 1, y + 12, 3, 1); ctx.fillStyle = K.out; ctx.fillRect(fx, y + 13, 1, 1);
  text(DRUGS[b.drug].key, x + 4, y + 3, DRUGS[b.drug].color, { shadow:false }); text(money(b.price), x + 16, y + 3, C(12,31,18), { shadow:false });
}
function drawWorld() {
  const cx = Math.round(cam.x), cy = Math.round(cam.y), p = G.p;
  ctx.drawImage(BG, -cx, -cy);
  const inView = (x, y, m = 60) => x > cx - m && x < cx + SZ + m && y > cy - m && y < cy + SZ + m;
  const list = [], chars = [];
  for (const o of OBJS) if (inView(o.x, o.y)) list.push({ k:o.y + o.d, draw:() => ctx.drawImage(o.img, o.x - 1 - cx, o.y - o.h - 1 - cy) });
  for (const t of TOWERS) if (inView(nodes[t].x, nodes[t].y, 90)) list.push({ k:nodes[t].y - 3, draw:() => drawTower(t, cx, cy) });
  for (const b of G.buyers) if (inView(b.x, b.y)) {
    const bob = Math.floor(T*2 + b.x) % 2;
    chars.push({ k:b.y, draw:a => { if (a === 1) shadowAt(b.x - cx, b.y - cy, 5); drawChar('buyer', b.x - cx, b.y - cy - bob, { dx:0, dy:1 }, 0, a); }, bubble:() => drawBubble(b, b.x - cx, b.y - cy) });
  }
  for (const en of G.enemies) {
    const e = edgePos(en.e, en.t); if (!inView(e.x, e.y)) continue;
    const face = { dx:edges[en.e].dx * en.dir, dy:edges[en.e].dy * en.dir }, fx = Math.round(e.x) - cx, fy = Math.round(e.y) - cy;
    chars.push({ k:e.y, draw:a => {
      if (a === 1) shadowAt(fx, fy, 5);
      if (en.stun > 0 && Math.floor(T*10) % 2) return;
      drawChar(en.type, fx, fy, face, en.stun > 0 ? 0 : charFrame(en.anim, true), a);
      if (en.stun > 0 && a === 1) { ctx.fillStyle = C(30,26,10); for (let k = 0; k < 3; k++) { const an = T*6 + k*2.1; ctx.fillRect(fx + Math.round(Math.cos(an)*6), fy - 25 + Math.round(Math.sin(an)*2), 1, 1); } }
    } });
  }
  const blink = p.hurt > 0 && Math.floor(T*12) % 2, air = p.vz !== 0 || p.z > surfaceAt(p.x, p.y) + .5;
  const pk = p.y + p.z + (nearDoor() >= 0 ? 6 : 0);
  chars.push({ k:pk, draw:a => {
    const s = surfaceAt(p.x, p.y), px = Math.round(p.x) - cx;
    if (a === 1) shadowAt(px, Math.round(p.y - s) - cy, Math.max(2, 5 - Math.round((p.z - s) / 6)));
    if (!blink) drawChar('player', px, Math.round(p.y - p.z) - cy, p.face, air ? 3 : charFrame(p.anim, p.moving), a);
  } });
  for (const c of chars) list.push(c);
  list.sort((a, b) => a.k - b.k);
  for (const o of list) o.draw(1);
  for (const c of chars) c.draw(.4);                               // x-ray ghost where something hides a person
  for (const c of chars) if (c.bubble) c.bubble();
  for (const d of dust) { ctx.fillStyle = 'rgb(165,160,170)'; const s = d.life > .2 ? 2 : 1; ctx.fillRect(Math.round(d.x) - cx, Math.round(d.y - (.35 - d.life)*10) - cy, s, s); }
  for (const f of G.floats) { ctx.globalAlpha = Math.min(1, f.life); text(f.text, Math.round(f.x) - cx, Math.round(f.y) - cy, f.color, { align:'c' }); ctx.globalAlpha = 1; }
  // searchlight
  if (G.light) { ctx.globalAlpha = G.spotted > 0 ? .3 : .18; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(GLOW, Math.round(G.light.x) - 28 - cx, Math.round(G.light.y) - 18 - cy); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  // acid rain
  ctx.fillStyle = 'rgba(150,170,215,.5)';
  for (const r of rain) { ctx.fillRect(r.x | 0, r.y | 0, 1, 3); }
  ctx.fillStyle = 'rgba(170,190,230,.6)';
  for (const s of splash) { if (s.life > .08) { ctx.fillRect(s.x - 1, s.y, 1, 1); ctx.fillRect(s.x + 1, s.y, 1, 1); } else ctx.fillRect(s.x, s.y - 1, 1, 1); }
  ctx.drawImage(VIGNETTE, 0, 0);
  if (G.heat) { ctx.globalAlpha = .16 + .08 * Math.sin(T*6); ctx.fillStyle = 'rgb(200,20,30)'; ctx.fillRect(0, 0, SZ, SZ); ctx.globalAlpha = 1; }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 2.5; ctx.fillStyle = 'rgb(220,225,255)'; ctx.fillRect(0, 0, SZ, SZ); ctx.globalAlpha = 1; }
}

// HUD: drop-shadowed text, hearts, a magic-meter style dash gauge and a minimap.
function drawHUD() {
  ctx.drawImage(COIN, 4, 4); text(money(G.cash), 14, 4, K.white);
  ctx.drawImage(SKULL, 4, 14); text(money(G.debt), 14, 14, C(31,12,12));
  text(`DAY ${G.day}/${TOTAL_DAYS}`, 4, 25, C(30,26,10));
  rr(4, 35, 40, 4, K.out); ctx.fillStyle = K.dark[1]; ctx.fillRect(5, 36, 38, 2); ctx.fillStyle = C(30,26,10); ctx.fillRect(5, 36, Math.round(38 * G.dayT / DAY_LEN), 2);
  let ty = 43;
  if (G.event) { text(`${DRUGS[G.event.drug].name} ${G.event.mult > 1 ? 'SPIKE' : 'CRASH'}`, 4, ty, G.event.mult > 1 ? C(31,10,10) : C(10,31,14)); ty += 10; }
  if (G.heat && Math.floor(T*3) % 2) { text('CURFEW', 4, ty, C(31,10,10)); } if (G.heat) ty += 10;
  if (G.spotted > 0 && Math.floor(T*4) % 2) text('SPOTTED', 4, ty, C(31,28,12));
  const halves = Math.max(0, Math.ceil(G.health / 10));
  for (let i = 0; i < 5; i++) { const h = Math.max(0, Math.min(2, halves - i*2)); ctx.drawImage(h === 2 ? HEARTS.full : h === 1 ? HEARTS.half : HEARTS.empty, 207 + i*9, 4); }
  text(`PACK ${used()}/${CAPACITY}`, 252, 15, used() >= CAPACITY ? C(31,12,12) : K.white, { align:'r' });
  // minimap
  const mx = 202, my = 26; rr(mx - 2, my - 2, 52, 52, K.out); ctx.drawImage(MINI, mx, my);
  const dot = (x, y, col, s = 1) => { ctx.fillStyle = col; ctx.fillRect(mx + Math.round(x / 12) - (s >> 1), my + Math.round(y / 12) - (s >> 1), s, s); };
  for (const t of TOWERS) dot(nodes[t].x, nodes[t].y, nodes[t].neon, 3);
  for (const b of G.buyers) dot(b.x, b.y, C(10,31,14), 2);
  for (const en of G.enemies) { const e = edgePos(en.e, en.t); dot(e.x, e.y, en.type === 'cop' ? C(10,20,31) : C(31,8,8)); }
  if (Math.floor(T*4) % 2) dot(G.p.x, G.p.y, K.white, 2);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeRect(mx + Math.round(cam.x/12) + .5, my + Math.round(cam.y/12) + .5, 21, 21);
  // dash = the magic meter
  const gx = 4, gy = ty + 12, gh = 32, fill = G.p.cd > 0 ? 1 - G.p.cd / DASH_CD : 1;
  rr(gx, gy, 9, gh, K.out); rr(gx + 1, gy + 1, 7, gh - 2, K.winLight); ctx.fillStyle = K.dark[0]; ctx.fillRect(gx + 2, gy + 2, 5, gh - 4);
  const fh = Math.round((gh - 4) * fill); ctx.fillStyle = fill >= 1 ? C(8,28,10) : C(5,16,8); ctx.fillRect(gx + 2, gy + 2 + (gh - 4 - fh), 5, fh);
  if (fh > 0) { ctx.fillStyle = C(18,31,18); ctx.fillRect(gx + 2, gy + 2 + (gh - 4 - fh), 1, fh); }

  const n = nearDoor();

    const fx = Math.round(G.p.x - cam.x), fy = Math.round(G.p.y - cam.y), label = 'A: ENTER ' + nodes[n].name, w = label.length*6 + 8;
    button(clamp(fx - (w >> 1), 2, SZ - w - 2), fy - 38 - (Math.floor(T*3) % 2), label, pressA, true, C(30,26,10));
  }
  // message window with typewriter text
  const m = G.msg;
  if (m.t < 4.5 && m.text) {
    const shown = m.text.slice(0, Math.floor(m.t * 45)), words = m.text.split(' '), lines = []; let cur = '';
    for (const w of words) { if ((cur + ' ' + w).trim().length > 37) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); } lines.push(cur);
    const h = lines.length*10 + 10, y = SZ - h - 4; win(4, y, 248, h);
    let left = shown.length;
    lines.forEach((l, i) => { text(l.slice(0, Math.max(0, left)), 10, y + 6 + i*10, K.white); left -= l.length + 1; });
  }
}

function drawMarket() {
  ctx.drawImage(DITHER, 0, 0);
  const nd = nodes[marketNode], pr = G.prices[marketNode]; win(4, 4, 248, 248);
  text(nd.title, 128, 11, nd.neon, { align:'c' });
  text(`DAY ${G.day}/${TOTAL_DAYS}  CASH ${money(G.cash)}`, 10, 22, K.white);
  text(`PACK ${used()}/${CAPACITY}  HP ${Math.round(G.health)}%`, 10, 32, K.dim);
  if (G.event) text(`${DRUGS[G.event.drug].name} ${G.event.mult > 1 ? 'UP' : 'DOWN'}`, 246, 32, G.event.mult > 1 ? C(31,10,10) : C(10,31,14), { align:'r' });
  text('GOODS', 18, 44, K.dim); text('BUY', 88, 44, K.dim, { align:'r' }); text('SELL', 132, 44, K.dim, { align:'r' }); text('OWN', 152, 44, K.dim, { align:'r' });
  const rows = rowCount(), rh = nd.hub ? 14 : 16;
  for (let r = 0; r < rows; r++) {
    const y = 54 + r*rh;

    if (sel === r) { ctx.fillStyle = C(5,5,15); ctx.fillRect(8, y - 1, 240, rh - 2); ctx.drawImage(CURSOR, 9 + (Math.floor(T*4) % 2), y + 1); }

      text(d.name, 18, y + 2, d.color);
      text(money(pr[r]), 88, y + 2, cheap ? C(10,31,14) : dear ? C(31,10,10) : K.white, { align:'r' });
      text(money(bid(marketNode, r)), 132, y + 2, G.inv[r] && bid(marketNode, r) > G.cost[r] ? C(10,31,14) : K.dim, { align:'r' });
      text(G.inv[r], 152, y + 2, G.inv[r] ? K.white : K.dim, { align:'r' });
      const bx = 164 + button(164, y, 'SELL', () => { sel = r; openDeal('sell', r); }, G.inv[r] > 0) + 2;
      button(bx, y, 'BUY', () => { sel = r; openDeal('buy', r); }, maxBuy > 0);

// the BUY / SELL quantity box
function drawDeal(pr) {
  const { kind, i } = deal, d = DRUGS[i], buying = kind === 'buy', each = buying ? pr[i] : bid(marketNode, i), m = Math.max(1, dealMax(kind, i));
  deal.qty = clamp(deal.qty, 1, m);
  const q = deal.qty, total = q * each, x = 26, y = 66, w = 204, h = 128;
  ui.hits.push({ x:0, y:0, w:SZ, h:SZ, fn:() => {} });                  // the box is modal
  win(x, y, w, h);
  text(`${buying ? 'BUY' : 'SELL'} ${d.name}`, 128, y + 8, d.color, { align:'c' });
  text(`${money(each)} EACH`, 128, y + 19, K.dim, { align:'c' });
  const arrowL = q > 1, arrowR = q < m;
  text('<', 92, y + 35, arrowL ? K.white : K.dim, { scale:2 }); text('>', 154, y + 35, arrowR ? K.white : K.dim, { scale:2 });
  text(String(q), 128, y + 35, K.white, { align:'c', scale:2 });
  let bx = 46;
  bx += button(bx, y + 54, '-5', () => dealAdjust(-5), q > 1) + 3;
  bx += button(bx, y + 54, '-1', () => dealAdjust(-1), q > 1) + 3;
  bx += button(bx, y + 54, '+1', () => dealAdjust(1), q < m) + 3;
  bx += button(bx, y + 54, '+5', () => dealAdjust(5), q < m) + 3;
  button(bx, y + 54, buying ? 'MAX' : 'ALL', () => { deal.qty = m; }, q < m);
  text(`TOTAL ${buying ? '-' : '+'}${money(total)}`, 128, y + 72, buying ? C(31,14,12) : C(10,31,14), { align:'c' });
  text(`CASH AFTER ${money(G.cash + (buying ? -total : total))}`, 128, y + 83, K.dim, { align:'c' });
  button(62, y + 98, ' A: OK ', confirmDeal, true, C(30,26,10));
  button(136, y + 98, ' B: BACK ', () => { deal = null; }, true);
}

function drawTitle() {
  ctx.drawImage(DITHER, 0, 0);
  const wob = Math.round(Math.sin(T*2));
  text('DOPE SHOW', 128, 22 + wob, C(31,8,8), { align:'c', scale:3, shadow:C(8,1,2) });
  text('DOPE SHOW', 128, 20 + wob, C(31,22,6), { align:'c', scale:3, shadow:false });
  text('A TALE OF THE DIRECTORATE', 128, 48, C(18,18,24), { align:'c' });
  win(8, 62, 240, 132);
  const L = ['THE DIRECTORATE OWNS THE CITY.', 'YOU OWE IT $5,500 AT 6% A DAY.', '30 DAYS TO PAY OR BE ERASED.', '',
             'D-PAD  RUN THE STREETS', 'A  JUMP / ENTER A TOWER', 'B  DASH     LAND ON HEADS TO STUN', 'STAND ON CRATES AND CARS TO HIDE', 'STREET BUYERS PAY THE MOST'];
  L.forEach((l, i) => text(l, 128, 71 + i*13, i < 3 ? K.white : K.dim, { align:'c' }));
  if (Math.floor(T*2) % 2) text('PRESS A', 128, 202, K.white, { align:'c' });
  button(100, 214, ' START ', start, true, C(30,26,10));
  let best = 0; try { best = +localStorage.getItem('dopeshow-best2') || 0; } catch (e) {}
  if (best) text('BEST ' + money(best), 128, 238, C(30,26,10), { align:'c' });
}
function drawOver() {
  ctx.drawImage(DITHER, 0, 0); win(24, 70, 208, 126);
  text(G.health <= 0 ? 'DETAINED' : 'TIME UP', 128, 80, C(31,10,10), { align:'c', scale:2 });
  text(G.over.reason, 128, 100, K.dim, { align:'c' });
  text(`CASH ${money(G.cash)}`, 128, 116, K.white, { align:'c' }); text(`DEBT ${money(G.debt)}`, 128, 127, C(31,12,12), { align:'c' });
  text(`SCORE ${money(G.over.score)}`, 128, 141, G.over.score >= 0 ? C(10,31,14) : C(31,10,10), { align:'c' });
  if (G.over.best) text('NEW BEST!', 128, 153, C(30,26,10), { align:'c' });
  if (Math.floor(T*2) % 2) text('PRESS A', 128, 170, K.white, { align:'c' });
  button(96, 180, ' TRY AGAIN ', start, true, C(30,26,10));
}

// ───────────────────────── Power ─────────────────────────
const gbEl = document.getElementById('gb'); let audio = null;
function chime() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    [[1046.5, 0], [2093, .09]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain(); o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.08, t + d + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d + .5);
      o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + .55);
    });
  } catch (e) {}
}
function setPower(on) {
  gbEl.classList.toggle('on', on); buzz();
  for (const k in held) held[k] = 0; pointer = null;
  if (on) { newGame(); state = 'boot'; bootT = 0; chime.done = false; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }
  else state = 'off';
}
// pointerdown, not click: sandboxed/embedded views on phones may never synthesize a click from a tap
document.getElementById('power').addEventListener('pointerdown', ev => { ev.preventDefault(); setPower(state === 'off'); });
function drawBoot(dt) {
  bootT += dt;
  ctx.fillStyle = K.winFill; ctx.fillRect(0, 0, SZ, SZ);
  const y = Math.min(108, -20 + bootT * 110);
  text('DIRECTORATE', 128, y, C(31,22,6), { align:'c', scale:2, shadow:C(12,2,4) });
  if (y >= 108) {
    if (!chime.done) { chime.done = true; chime(); }
    text('ISSUE NO. 30', 128, y + 22, K.dim, { align:'c' });
  }
  if (bootT > 2.6) state = 'title';
}



// ───────────────────────── Loop ─────────────────────────
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; ui.hits = [];
  if (state === 'play') { update(dt); for (let i = dust.length - 1; i >= 0; i--) { dust[i].life -= dt; if (dust[i].life <= 0) dust.splice(i, 1); } }
  G.msg.t += dt;
  for (const r of rain) { r.y += r.vy*dt; r.x -= r.vy*dt*.15; if (r.y > r.end) { splash.push({ x:r.x | 0, y:r.y | 0, life:.16 }); r.y = -4; r.x = Math.random()*(SZ + 40); r.end = 30 + Math.random()*226; } }
  for (let i = splash.length - 1; i >= 0; i--) { splash[i].life -= dt; if (splash[i].life <= 0) splash.splice(i, 1); }
  if (state === 'off') { requestAnimationFrame(frame); return; }
  if (state === 'boot') { drawBoot(dt); requestAnimationFrame(frame); return; }
  if (state === 'market') {
    for (const k of deal ? ['up', 'down', 'left', 'right'] : ['up', 'down']) if (held[k]) { holdT[k] += dt; if (holdT[k] > .35) { holdT[k] -= .09; marketBtn(k); } }
    if (toast && (toast.t -= dt) <= 0) toast = null;
  }
  ctx.clearRect(0, 0, SZ, SZ); drawWorld();
  if (state === 'play') drawHUD();
  else if (state === 'market') drawMarket();
  else if (state === 'title') drawTitle();
  else if (state === 'over') { drawHUD(); drawOver(); }
  requestAnimationFrame(frame);
}
newGame();
requestAnimationFrame(frame);
</script>
