  #pop { --k:2; position:absolute; z-index:6; background:#101830; border:calc(var(--k)*1px) solid #f8f8f8; border-radius:calc(var(--k)*3px);
         padding:calc(var(--k)*3px); box-shadow:0 0 0 calc(var(--k)*1px) #000, inset 0 0 0 calc(var(--k)*1px) #4858b0; image-rendering:pixelated; }

              background:#203078; border:calc(var(--k)*1px) solid #c8c8e0; border-radius:calc(var(--k)*2px); padding:calc(var(--k)*2px) calc(var(--k)*1px); cursor:pointer; }
  #pop .btn:active { background:#3850b8; }
  #pop .btn.sel { border-color:#f8d030; box-shadow:0 0 0 calc(var(--k)*1px) #b07810; }

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="pop" hidden></div>

<script>
'use strict';
/* ============================== constants ============================== */
const N = 7;                                   // board is 7x7, plus one kitchen row beneath
const ENT = {c:3, r:0}, CTR = {c:3, r:6}, DOOR = {c:0, r:6};
const MAX_LEAKS = 3, PANTRY_CAP = 300, LADY_CAP = 100, BATCH = 10;
const AMMO = {
  hot:{name:'Hotdog', pts:1, price:1, range:4,   emoji:'🌭', col:'#d9503a'},
  ten:{name:'Tendies',pts:2, price:2, range:2.5, emoji:'🍗', col:'#e0a030'},
  pas:{name:'Pasta',  pts:4, price:4, range:1.5, emoji:'🍝', col:'#f4dc7a'}
};
const AKEYS = ['hot','ten','pas'];
const STU = {
  nerd:{hun:2, pay:3.0,  spd:1.5, r:.2},
  cheer:{hun:3, pay:4.5, spd:1.1, r:.2},
  band:{hun:5, pay:7.5,  spd:0.9, r:.22},
  foot:{hun:8, pay:12.0, spd:0.6, r:.28}
};
const STYPES = Object.keys(STU);
const TABLE_HP = 100, TABLE_UP_HP = 50;
const COST = {table:10, lady:30, dur:15, chk:25, fast:25, mop:25};
const FIRE_RATE = 1, FAST_MULT = 1.5, PROJ_TIME = .42;
const MOP_CD = 20, PUDDLE_T = 4;
const RUNNER_LOAD = 3, RUNNER_SPD = 1;
const idx = (c,r) => r*N + c;
const inB = (c,r) => c>=0 && r>=0 && c<N && r<N;
const DIRS = [[0,1],[-1,0],[1,0],[0,-1]];

/* ============================== state ============================== */
let G = null;
const ui = {sel:null, dKey:'ten', dQty:10, toastT:0, toastMsg:''};

function newGame(){
  const grid = Array.from({length:N}, () => Array(N).fill(null));
  G = {
    state:'title', t:0, wallet:40, leaks:0,
    pantry:{hot:0, ten:0, pas:0},
    grid, students:[], projs:[], puddles:[], floats:[], lady:[],
    runners:[{i:0,state:'idle',x:.55,y:7.5,wp:[],t:0},{i:1,state:'idle',x:1.45,y:7.5,wp:[],t:0}],
    spawnAcc:.5, nextId:1, combo:0, comboT:0, moneyPop:0, demo:false, fbT:0, flash:0, shake:0, layoutVer:0, fieldN:null, fieldF:null, dirty:true
  };
  [[2,2],[4,2],[3,4]].forEach(([c,r]) => placeTable(c,r));
  [[2,3],[4,3]].forEach(([c,r]) => { const l = placeLady(c,r); l.ammo.ten = 20; });
  refreshFields(); PARTS=[]; RINGS=[]; POOFS=[]; GEMS=[]; BANNER=null;
}
function placeTable(c,r){ const o={kind:'table',c,r,hp:TABLE_HP,max:TABLE_HP,dur:false,chk:false}; G.grid[r][c]=o; G.dirty=true; return o; }
function placeLady(c,r){ const o={kind:'lady',c,r,ammo:{hot:0,ten:0,pas:0},incoming:0,cd:.4,fast:false,mop:false,mopCd:0,anim:0}; G.grid[r][c]=o; G.lady.push(o); G.dirty=true; return o; }
const ladyTotal = l => l.ammo.hot + l.ammo.ten + l.ammo.pas;
const pantryTotal = () => G.pantry.hot + G.pantry.ten + G.pantry.pas;

/* ============================== pathing ============================== */
function buildField(tc){
  const d = new Array(N*N).fill(Infinity); d[idx(CTR.c,CTR.r)] = 0;
  let ch = true;
  while(ch){
    ch = false;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(c===CTR.c && r===CTR.r) continue;
      const o = G.grid[r][c];
      if(o && o.kind==='lady') continue;
      let best = Infinity;
      for(const [dc,dr] of DIRS){ const a=c+dc,b=r+dr; if(inB(a,b) && d[idx(a,b)]<best) best=d[idx(a,b)]; }
      const v = best + (o ? tc : 1);
      if(v < d[idx(c,r)]){ d[idx(c,r)] = v; ch = true; }
    }
  }
  return d;
}
function refreshFields(){ G.fieldN = buildField(1000); G.fieldF = buildField(4); G.dirty = false; G.layoutVer++; }

function bfs(from, to){                         // runner walking path, excludes `from`
  if(from.c===to.c && from.r===to.r) return [];
  const prev = new Map(), key = (c,r)=>r*N+c, q=[from]; prev.set(key(from.c,from.r), null);
  while(q.length){
    const cur = q.shift();
    for(const [dc,dr] of DIRS){
      const c=cur.c+dc, r=cur.r+dr; if(!inB(c,r) || prev.has(key(c,r))) continue;
      const isGoal = c===to.c && r===to.r, o = G.grid[r][c];
      if(!isGoal && (o || (c===CTR.c && r===CTR.r))) continue;
      prev.set(key(c,r), cur);
      if(isGoal){ const out=[]; let n={c,r}; while(n && !(n.c===from.c && n.r===from.r)){ out.push(n); n=prev.get(key(n.c,n.r)); } return out.reverse(); }
      q.push({c,r});
    }
  }
  return null;
}

/* ============================== actions ============================== */
function spend(n){ if(G.wallet < n) return false; G.wallet -= n; return true; }
function floatText(x,y,txt,col,sz){ G.floats.push({x,y,txt,col:col||'#ffd24d',t:0,sz:sz||1}); }
function demoBot(){
  if(pantryTotal()<40 && G.wallet>=20) actBuy('ten'); else if(pantryTotal()<20 && G.wallet>=10) actBuy('hot');
  for(const l of G.lady) if(ladyTotal(l)+l.incoming<50) actSend(l, G.pantry.ten>=10?'ten':'hot', 20);
  if(G.wallet>=70 && G.lady.length<4){ for(const [c,r] of [[3,5],[2,4],[4,4]]) if(actBuild(c,r,'lady').ok) break; }
  else if(G.wallet>=55){ const l=G.lady.find(x=>!x.mop); if(l) actUpgrade(l,'mop'); }
}
function demoReset(){ newGame(); G.state='play'; G.demo=true; }

function studentNear(c,r,rad){
  return G.students.some(s => (s.cx===c&&s.cy===r) || (s.nx===c&&s.ny===r) || Math.hypot(s.x-(c+.5), s.y-(r+.5)) < rad);
}
function actBuild(c,r,kind){
  if(!inB(c,r) || G.grid[r][c]) return {ok:false,msg:'Occupied'};
  if((c===ENT.c&&r===ENT.r)||(c===CTR.c&&r===CTR.r)||(c===DOOR.c&&r===DOOR.r)) return {ok:false,msg:'Keep that tile clear'};
  if(studentNear(c,r,.8)) return {ok:false,msg:'A student is in the way'};
  if(G.wallet < COST[kind]) return {ok:false,msg:'Not enough money'};
  if(kind==='lady'){
    const adj = DIRS.some(([dc,dr]) => { const a=c+dc,b=r+dr; if(!inB(a,b)) return false; const o=G.grid[b][a]; return (o&&o.kind==='table') || (a===CTR.c&&b===CTR.r); });
    if(!adj) return {ok:false,msg:'Must be next to a table or the counter'};
    G.grid[r][c] = {kind:'lady'};                // probe: must not wall off the route completely
    const f = buildField(1000); G.grid[r][c] = null;
    if(!isFinite(f[idx(ENT.c,ENT.r)]) || G.students.some(s => !isFinite(f[idx(s.cx,s.cy)]))) return {ok:false,msg:'That would trap the students'};
    spend(COST.lady); placeLady(c,r);
  } else { spend(COST.table); placeTable(c,r); }
  burst(c+.5,r+.7,12,['#ffffff','#e8dcc0'],1.8,.08,.5,0,'puff'); ring(c+.5,r+.5,'#ffffff',.8,.35);
  return {ok:true};
}
function actUpgrade(o,kind){
  if(kind==='dur' && !o.dur){ if(!spend(COST.dur)) return fail(); o.dur=true; o.max+=TABLE_UP_HP; o.hp+=TABLE_UP_HP; }
  else if(kind==='chk' && !o.chk){ if(!spend(COST.chk)) return fail(); o.chk=true; }
  else if(kind==='fast' && !o.fast){ if(!spend(COST.fast)) return fail(); o.fast=true; }
  else if(kind==='mop' && !o.mop){ if(!spend(COST.mop)) return fail(); o.mop=true; o.mopCd=6; }
  else return {ok:false,msg:'Already owned'};
  burst(o.c+.5,o.r+.5,18,['#ffd24d','#ffffff','#9ef0b0'],2.2,.05,.7,0,'star'); ring(o.c+.5,o.r+.5,'#ffd24d',1,.45);
  return {ok:true};
  function fail(){ return {ok:false,msg:'Not enough money'}; }
}
function actBuy(k){
  const a = AMMO[k], cost = a.price*BATCH;
  if(pantryTotal()+BATCH > PANTRY_CAP) return {ok:false,msg:'Pantry is full'};
  if(!spend(cost)) return {ok:false,msg:'Not enough money'};
  G.pantry[k] += BATCH; return {ok:true};
}
function sendQty(l,k,want){ return Math.max(0, Math.min(want, G.pantry[k], LADY_CAP - ladyTotal(l) - l.incoming)); }
function actSend(l,k,want){
  const run = G.runners.find(r => r.state==='idle');
  if(!run) return {ok:false,msg:'Both runners are busy'};
  const q = sendQty(l,k,want);
  if(q<=0) return {ok:false,msg: G.pantry[k]<=0 ? 'Pantry is out of '+AMMO[k].name : 'She is full'};
  if(!bfs(DOOR,{c:l.c,r:l.r}) ) return {ok:false,msg:'No path from the kitchen'};
  G.pantry[k] -= q; l.incoming += q;
  Object.assign(run, {state:'loading', t:RUNNER_LOAD, lady:l, cargo:{k,q}, wp:[]});
  return {ok:true};
}

/* ============================== simulation ============================== */
function spawnRate(t){ return (20 + 30*Math.min(t,90)/90) / 60; }       // students per second
function spawnStudent(){
  const type = STYPES[Math.floor(Math.random()*4)], d = STU[type];
  G.students.push({id:G.nextId++, type, x:ENT.c+.5, y:ENT.r+.05, cx:ENT.c, cy:ENT.r, nx:ENT.c, ny:ENT.r,
    hunger:d.hun, max:d.hun, pending:0, stun:0, atk:null, bias:Math.random()<.5, ox:(Math.random()-.5)*.22, oy:(Math.random()-.5)*.1, anim:Math.random()*6, hit:0, age:0});
  burst(ENT.c+.5, ENT.r+.4, 6, ['#ffffff','#bfe3ff'], 1.2, .05, .4, 0, 'puff');
}
function decide(s){
  const f = s.type==='foot' ? G.fieldF : G.fieldN;
  const dirs = s.bias ? [[0,1],[1,0],[-1,0],[0,-1]] : DIRS;
  let best=null, bd=Infinity;
  for(const [dc,dr] of dirs){
    const c=s.cx+dc, r=s.cy+dr; if(!inB(c,r)) continue;
    const o = G.grid[r][c]; if(o && o.kind==='lady') continue;
    const v = f[idx(c,r)]; if(v < bd){ bd=v; best=[c,r]; }
  }
  if(!best) return;
  const o = G.grid[best[1]][best[0]];
  if(o && o.kind==='table') s.atk = o; else { s.nx=best[0]; s.ny=best[1]; }
}
function slowOf(s){
  let slow = 0;
  for(const p of G.puddles) if(Math.abs(s.x-(p.c+.5))<1.5 && Math.abs(s.y-(p.r+.5))<1.5) slow += .5;
  const tiles = [[s.cx,s.cy],...DIRS.map(([a,b])=>[s.cx+a,s.cy+b])];
  for(const [c,r] of tiles){ if(inB(c,r)){ const o=G.grid[r][c]; if(o && o.kind==='table' && o.chk){ slow += .4; break; } } }
  return Math.min(.7, slow);
}
function killTable(o){
  G.grid[o.r][o.c] = null; G.dirty = true; G.shake = .25;
  floatText(o.c+.5, o.r+.4, 'SMASH!', '#ffb347', 1.3);
  burst(o.c+.5, o.r+.5, 26, ['#a97545','#7b4f27','#d9a36a'], 3.2, .07, .9, 7, 'chip');
  burst(o.c+.5, o.r+.5, 10, ['#ffffff'], 1.6, .12, .5, 0, 'puff'); ring(o.c+.5,o.r+.5,'#ffb347',1.3,.45);
  for(const s of G.students) if(s.atk===o) s.atk = null;
}
function updateStudent(s,dt){
  s.anim += dt; s.age += dt;
  if(s.hit>0) s.hit -= dt;
  if(s.stun>0){ s.stun -= dt; return; }
  if(s.atk){
    const o = s.atk;
    if(G.grid[o.r][o.c] !== o) s.atk = null;
    else { o.hp -= (s.type==='foot'?60:20)*dt; o.flash = .1;
      if(Math.random()<dt*7) burst(o.c+.5+(s.x-o.c-.5)*.5, o.r+.5+(s.y-o.r-.5)*.5, 2, ['#a97545','#d9a36a'], 1.6, .05, .5, 6, 'chip'); if(o.hp<=0) killTable(o); return; }
  }
  if(s.nx!==s.cx || s.ny!==s.cy){                                  // route changed under our feet
    const o = G.grid[s.ny][s.nx]; if(o){ s.nx=s.cx; s.ny=s.cy; }
  }
  const tx = s.nx+.5, ty = s.ny+.5, dx = tx-s.x, dy = ty-s.y, dist = Math.hypot(dx,dy);
  const sp = STU[s.type].spd * (1-slowOf(s)) * dt;
  if(dist <= sp){
    s.x=tx; s.y=ty; s.cx=s.nx; s.cy=s.ny;
    if(s.cx===CTR.c && s.cy===CTR.r){ leak(s); return; }
    decide(s);
  } else { s.x += dx/dist*sp; s.y += dy/dist*sp; }
}
function leak(s){
  s.dead = true; G.leaks++; G.flash = .5; G.shake = .4;
  floatText(s.x, s.y-.3, 'MISSED!', '#ff6b5a', 1.2);
  burst(s.x, s.y, 22, ['#ff5a4a','#ff9a5a','#ffd24d'], 3, .07, .7, 2, 'spark'); ring(s.x,s.y,'#ff5a4a',1.6,.5);
  banner('MISSED!', '#ff5a4a');
  if(G.demo && G.leaks>=MAX_LEAKS){ demoReset(); return; }
  if(G.leaks >= MAX_LEAKS) gameOver();
}
function chooseAmmo(l, dist, remain){
  let best=null;
  for(const k of AKEYS){ if(l.ammo[k]>0 && AMMO[k].range>=dist){ if(AMMO[k].pts<=remain && (!best || AMMO[k].pts>AMMO[best].pts)) best=k; } }
  if(best) return best;
  for(const k of AKEYS){ if(l.ammo[k]>0 && AMMO[k].range>=dist){ if(!best || AMMO[k].pts<AMMO[best].pts) best=k; } }
  return best;
}
function updateLady(l,dt){
  l.anim = Math.max(0, l.anim-dt);
  l.cd -= dt;
  const lx=l.c+.5, ly=l.r+.5;
  if(l.cd <= 0){
    let tgt=null, k=null, bd=Infinity;
    for(const s of G.students){
      if(s.dead || s.hunger-s.pending<=0) continue;
      const d = Math.hypot(s.x-lx, s.y-ly); if(d>=bd) continue;
      const a = chooseAmmo(l, d, s.hunger-s.pending); if(a){ bd=d; tgt=s; k=a; }
    }
    if(tgt){
      l.ammo[k]--; tgt.pending += AMMO[k].pts; l.anim = .25; l.dir = Math.sign(tgt.x-lx)||1;
      G.projs.push({x0:lx,y0:ly-.25,s:tgt,k,t:0,trail:[]});
      l.cd = 1/(FIRE_RATE*(l.fast?FAST_MULT:1));
    } else l.cd = .1;
  }
  if(l.mop){
    l.mopCd -= dt;
    if(l.mopCd <= 0){
      let tgt=null, bd=5;
      for(const s of G.students){ const d=Math.hypot(s.x-lx,s.y-ly); if(d<bd){ bd=d; tgt=s; } }
      if(tgt){
        const dx=tgt.x-lx, dy=tgt.y-ly, sx=Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0, sy=sx?0:Math.sign(dy)||1;
        const c = Math.max(1,Math.min(N-2, l.c+sx*2)), r = Math.max(1,Math.min(N-2, l.r+sy*2));
        G.puddles.push({c,r,t:PUDDLE_T,seed:Math.random()*9}); l.mopCd = MOP_CD;
        burst(c+.5, r+.5, 24, ['#7cc8ff','#c8ecff','#ffffff'], 2.6, .06, .7, 6, 'drop'); ring(c+.5,r+.5,'#7cc8ff',1.7,.5);
      } else l.mopCd = 0;
    }
  }
}
function updateProj(p,dt){
  p.t += dt/PROJ_TIME;
  if(p.t < 1) return;
  p.done = true;
  const s = p.s, a = AMMO[p.k];
  s.pending -= a.pts;
  if(s.dead) return;                                            // target already gone: ammo is lost
  s.hunger -= a.pts; s.hit = .15;
  burst(s.x, s.y-.1, 7, [a.col,'#ffffff'], 1.8, .05, .45, 5, 'splat'); ring(s.x,s.y-.1,a.col,.45,.25);
  if(s.type==='cheer') s.stun = .5;                             // fragile: staggers on every hit
  if(s.hunger <= 0){
    s.dead = true; s.fed = true;
    const pay = STU[s.type].pay; G.wallet += pay;
    floatText(s.x, s.y-.3, '+$'+pay.toFixed(2), '#ffd24d', 1+pay/24);
    burst(s.x, s.y-.1, 18, ['#ff5fa2','#4cc2ff','#ffd24d','#6cf08a','#b48cff'], 3, .06, .9, 5, 'confetti');
    burst(s.x, s.y-.1, 3+Math.round(pay/3), ['#ffd24d'], 2, .09, 1.1, 0, 'coin');
    ring(s.x,s.y-.1,'#ffe680',.9,.4);
    G.combo = G.comboT>0 ? G.combo+1 : 1; G.comboT = 1.4;
    if(G.combo>=3) banner('COMBO x'+G.combo+'!', ['#ff5fa2','#4cc2ff','#ffd24d','#6cf08a'][G.combo%4]);
    G.moneyPop = .35;
  }
}
function updateRunner(r,dt){
  if(r.state==='idle') return;
  if(r.state==='loading'){
    r.t -= dt; if(r.t>0) return;
    const l=r.lady, p=bfs(DOOR,{c:l.c,r:l.r});
    if(!p){ G.pantry[r.cargo.k]+=r.cargo.q; l.incoming-=r.cargo.q; r.state='idle'; toast('No path for the runner'); return; }
    r.state='out'; r.goal={c:l.c,r:l.r}; r.ver=G.layoutVer;
    r.wp = [...(r.i?[{x:.55,y:7.5}]:[]), {x:.55,y:7.5},{x:DOOR.c+.5,y:DOOR.r+.5,tile:DOOR}, ...p.map(t=>({x:t.c+.5,y:t.r+.5,tile:t}))];
    return;
  }
  if(r.state==='stun'){ r.t -= dt; if(r.t<=0) startBack(r); return; }
  // out / back: bumped by a student in the kitchen corridor (bottom row)?
  if(r.y>=6 && r.y<7){
    for(const s of G.students) if(!s.dead && Math.hypot(s.x-r.x,s.y-r.y)<.5){
      if(r.state==='out'){ r.lady.incoming-=r.cargo.q; floatText(r.x,r.y-.3,'DROPPED!','#ff6b5a'); burst(r.x,r.y,12,[AMMO[r.cargo.k].col,'#fff'],2.4,.06,.6,6,'splat'); r.cargo=null; }
      r.state='stun'; r.t=2.5; r.wp=[]; return;
    }
  }
  let step = RUNNER_SPD*dt;
  while(step>0 && r.wp.length){
    const w=r.wp[0], dx=w.x-r.x, dy=w.y-r.y, d=Math.hypot(dx,dy);
    if(d<=step){
      r.x=w.x; r.y=w.y; step-=d; r.wp.shift();
      if(w.tile && r.ver!==G.layoutVer) repath(r,w.tile);
      if(r.state==='stun') return;
    } else { r.x+=dx/d*step; r.y+=dy/d*step; step=0; }
  }
  if(!r.wp.length){
    if(r.state==='out'){
      const l=r.lady; l.ammo[r.cargo.k]+=r.cargo.q; l.incoming-=r.cargo.q;
      floatText(l.c+.5,l.r+.2,'+'+r.cargo.q+AMMO[r.cargo.k].emoji,'#9ef0b0'); burst(l.c+.5,l.r+.4,14,['#9ef0b0','#ffffff','#ffd24d'],2,.05,.6,0,'star'); ring(l.c+.5,l.r+.5,'#9ef0b0',.9,.4); r.cargo=null;

function startBack(r){
  const here = {c:Math.max(0,Math.min(N-1,Math.floor(r.x))), r:Math.max(0,Math.min(N-1,Math.floor(r.y)))};
  const p = r.y<7 ? bfs(here, DOOR) : [];

  if(!p){ r.x=r.i?1.45:.55; r.y=7.5; r.state='idle'; return; }

  if(p){ r.wp = [...p.map(t=>({x:t.c+.5,y:t.r+.5,tile:t})), ...(r.state==='back'?[{x:.55,y:7.5},{x:r.i?1.45:.55,y:7.5}]:[])]; return; }
  if(r.state==='out'){ r.lady.incoming-=r.cargo.q; G.pantry[r.cargo.k]+=r.cargo.q; r.cargo=null; startBack(r); }

function update(dt){
  if(G.state!=='play') return;
  G.t += dt;
  if(G.dirty) refreshFields();
  G.spawnAcc += spawnRate(G.t)*dt;
  while(G.spawnAcc>=1){ G.spawnAcc-=1; spawnStudent(); }
  for(const s of G.students) updateStudent(s,dt);
  for(const l of G.lady) updateLady(l,dt);
  for(const p of G.projs) updateProj(p,dt);
  for(const r of G.runners) updateRunner(r,dt);
  for(const p of G.puddles) p.t -= dt;
  for(const f of G.floats) f.t += dt;
  G.comboT = Math.max(0, G.comboT-dt); G.moneyPop = Math.max(0, G.moneyPop-dt);
  if(G.demo){ G.botT=(G.botT||0)+dt; if(G.botT>.6){ G.botT=0; demoBot(); } }
  for(const [, o] of G.grid.flat().entries()) if(o && o.flash>0) o.flash -= dt;
  G.students = G.students.filter(s => !s.dead);
  G.projs = G.projs.filter(p => !p.done);
  G.puddles = G.puddles.filter(p => p.t>0);
  G.floats = G.floats.filter(f => f.t<1.2);
  G.flash = Math.max(0,G.flash-dt); G.shake = Math.max(0,G.shake-dt);
  // kitchen fallback: nothing left to throw and too poor to buy a batch
  const broke = pantryTotal()===0 && G.wallet<10 && G.lady.every(l=>ladyTotal(l)<5) && G.runners.every(r=>r.state==='idle');
  if(broke){ G.fbT += dt; if(G.fbT>=30){ G.fbT=0; G.pantry.hot += 10; toast('Kitchen sent 10 free hotdogs'); } } else G.fbT = 0;
}

/* ---- particles & effects (tile-space positions, pixel drawing) ---- */
let PARTS=[], RINGS=[], BANNER=null, POOFS=[], GEMS=[];
function burst(x,y,n,cols,spd,size,life,grav,kind){
  if(kind==='confetti'){ POOFS.push({x,y,t:0}); return; }
  if(kind==='coin'){ GEMS.push({x,y,vy:-2.6,h:0,t:0}); return; }
  if(PARTS.length>300) PARTS.splice(0,PARTS.length-300);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=spd*(.35+Math.random()*.65);
    PARTS.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(grav?spd*.45:0),g:grav,life:life*(.6+Math.random()*.6),t:0,col:cols[i%cols.length],kind,sz:size>.07?2:1});
  }
}
function ring(x,y,col,r,life){ RINGS.push({x,y,col,r,life,t:0}); }
function banner(txt,col){ BANNER={txt,col,t:0}; }
function toast(m){ ui.toastMsg=m; ui.toastT=1.8; }

  rect(x+6,y+5,6,1,'#f8f8f8'); rect(x+5,y+6,1,2,'#f8f8f8');

function drawStudent(s){

function drawRunner(r){

function drawProj(p){
  const s=p.s, t=Math.min(1,p.t), gx=p.x0+(s.x-p.x0)*t, gy=p.y0+.25+(s.y-p.y0-.25)*t;

function drawFx(dt){
  for(const p of PARTS){ p.t+=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  PARTS=PARTS.filter(p=>p.t<p.life);
  for(const p of PARTS){
    const x=px(p.x), y=py(p.y);
    if(p.kind==='spark'||p.kind==='star'){ if(Math.floor(p.t*20)%2){ rect(x-1,y,3,1,p.col); rect(x,y-1,1,3,p.col); } else rect(x,y,1,1,'#f8f8f8'); }
    else if(p.kind==='puff'){ const r=p.t/p.life<.5?2:1; rect(x-r,y-r,r*2,r*2,p.t/p.life<.5?'#f8f8f8':'#a8b8d8'); }
    else rect(x,y,p.sz,p.sz,p.col);
  }
  for(const r of RINGS){
    r.t+=dt; const f=r.t/r.life, rad=Math.max(2,r.r*T*.9*Math.min(1,f*1.4)), n=10;
    if(Math.floor(r.t*30)%2) for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+f; rect(px(r.x)+Math.round(Math.cos(a)*rad), py(r.y)+Math.round(Math.sin(a)*rad*.75),1,1,r.col); }
  }
  RINGS=RINGS.filter(r=>r.t<r.life);
  for(const p of POOFS){                                   // defeat poof: star, then four puffs drifting apart
    p.t+=dt; const x=px(p.x), y=py(p.y)-4, st=Math.floor(p.t/.09);
    if(st===0){ rect(x-3,y,7,1,'#f8f8f8'); rect(x,y-3,1,7,'#f8f8f8'); rect(x-1,y-1,3,3,'#f8f8f8'); }
    else { const d=2+st*2, sz=st<3?3:2; for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ rect(x+a*d-1,y+b*d-1,sz,sz,st<3?'#f8f8f8':'#a8c8f8'); if(st<3) rect(x+a*d,y+b*d,1,1,'#78a8f8'); } }
  }
  POOFS=POOFS.filter(p=>p.t<.5);
  const hx=(42-BX)/T, hy=(6-BY)/T;
  for(const g of GEMS){
    g.t+=dt;
    if(g.t<.55){ g.vy+=9*dt; g.h-=g.vy*dt; if(g.h<0){ g.h=0; g.vy*=-.5; } }
    else { const k=Math.min(1,dt*9); g.x+=(hx-g.x)*k; g.y+=(hy-g.y)*k; g.h*=.8; }
    shadow(px(g.x),py(g.y)+2,6);
    cx.drawImage(SP.gem,px(g.x)-4,py(g.y)-6-Math.round(g.h*T));
  }
  GEMS=GEMS.filter(g=>!(g.t>.55 && Math.abs(g.x-hx)+Math.abs(g.y-hy)<.25) && g.t<2.5);
}
function drawRange(o){

      <div class="ammo">${AKEYS.map(k=>`<span class="ic">${im(SP[k])}${PT(o.ammo[k],'#f8f8f8',true)}</span>`).join('')}</div>
      <div class="row">${upBtn('fast','FAST',COST.fast,o.fast,w)}${upBtn('mop','MOP',COST.mop,o.mop,w)}</div>
      <div class="hd" style="margin-top:calc(var(--k)*4px)">${PT('SEND RUNNER','#f8a830',true)}${PT(idle+'/2 READY','#f8a830',true)}</div>
      <div class="row">${AKEYS.map(k=>`<button class="btn ${ui.dKey===k?'sel':''}" data-act="k:${k}">${im(SP[k])}${PT(G.pantry[k],'#f8f8f8',true)}</button>`).join('')}${[10,20,30].map(n=>`<button class="btn ${ui.dQty===n?'sel':''}" data-act="q:${n}">${PT(n)}</button>`).join('')}</div>
      <div class="row"><button class="btn go" data-act="send" ${q<=0||!idle?'disabled':''}>${PT('SEND '+q)}</button></div>`;
  }
  pop.innerHTML=h; pop.hidden=false;
}
function placePop(){
  renderPop(); if(!ui.sel) return;
  const pw=pop.offsetWidth, ph=pop.offsetHeight, tx=OX+(BX+ui.sel.c*T)*K, ty=OY+(BY+ui.sel.r*T)*K, S=T*K;
  let left=Math.max(4,Math.min(innerWidth-pw-4, tx+S/2-pw/2));
  let top=ty+S+4; if(top+ph>innerHeight-2) top=ty-ph-4; if(top<2) top=Math.max(2,innerHeight-ph-2);
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function report(res){ if(!res.ok && res.msg) toast(res.msg); }
pop.addEventListener('pointerdown', e => {
  e.stopPropagation();
  const b=e.target.closest('[data-act]'); if(!b || b.disabled || G.state!=='play' || G.demo) return;
  e.preventDefault();
  const a=b.dataset.act, o=selObj(), {c,r}=ui.sel;
  if(a==='table'||a==='lady'){ const res=actBuild(c,r,a); report(res); if(!res.ok) return; if(a==='table') closeSel(); }
  else if(a==='dur'||a==='chk'||a==='fast'||a==='mop') report(actUpgrade(o,a));
  else if(a[0]==='k') ui.dKey=a.slice(2);
  else if(a[0]==='q') ui.dQty=+a.slice(2);
  else if(a==='send'){ const res=actSend(o,ui.dKey,ui.dQty); report(res); }
  if(ui.sel) placePop();
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if(G.demo){ start(); return; }
  if(G.state==='over'){ if(G.overT>1) start(); return; }
  const rect=cv.getBoundingClientRect(), ix=(e.clientX-rect.left)/K, iy=(e.clientY-rect.top)/K;
  for(let i=0;i<3;i++) if(ix>=CRATE_X[i]-1 && ix<CRATE_X[i]+27 && iy>=154 && iy<176){ report(actBuy(AKEYS[i])); if(ui.sel) placePop(); return; }
  const c=Math.floor((ix-BX)/T), r=Math.floor((iy-BY)/T);
  if(!inB(c,r) || (c===ENT.c&&r===ENT.r)||(c===CTR.c&&r===CTR.r)||(c===DOOR.c&&r===DOOR.r) || (ui.sel&&ui.sel.c===c&&ui.sel.r===r)){ closeSel(); return; }
  ui.sel={c,r}; placePop();
});
function start(){ newGame(); G.state='play'; G.demo=false; closeSel(); }

/* ============================== loop ============================== */
let last=performance.now(), popT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); render();
  if(ui.sel && G.state==='play' && !G.demo){ popT+=dt; if(popT>.3){ popT=0; placePop(); } }
  requestAnimationFrame(frame);
}
demoReset();
window.addEventListener('resize', layout);
layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
